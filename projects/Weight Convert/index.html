<!doctype html>

      <label for="">==></label>
      <select name="" id="temp2">

      </select>
      <br />
      <button id="convert">Convert</button>
      <button id="reset">Reset</button>
      <div class="result">
        <span> Result: <span id="result"></span> </span>
